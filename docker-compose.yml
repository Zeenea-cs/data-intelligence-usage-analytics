services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-actian_companion}
      POSTGRES_USER: ${POSTGRES_USER:-actian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Write a stable log file (db.log) into the shared log dir for the web UI.
    # Verbosity = log_min_messages; daily truncation bounds retention.
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/actian
      - -c
      - log_filename=db.log
      - -c
      - log_file_mode=0644
      - -c
      - log_rotation_age=1d
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_min_messages=${POSTGRES_LOG_MIN_MESSAGES:-warning}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./logs:/var/log/actian
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-actian} -d ${POSTGRES_DB:-actian_companion}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/var/log/actian
    environment:
      WEBUI_PORT: ${WEBUI_PORT:-8000}
      ACTIAN_INSTANCE_URL: ${ACTIAN_INSTANCE_URL}
      ACTIAN_API_KEY: ${ACTIAN_API_KEY}
      COLLECT_CRON: ${COLLECT_CRON:-0 0 * * *}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-actian_companion}
      POSTGRES_USER: ${POSTGRES_USER:-actian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /var/log/actian
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}

  metabase-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/actian
      - -c
      - log_filename=metabase-db.log
      - -c
      - log_file_mode=0644
      - -c
      - log_rotation_age=1d
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_min_messages=${POSTGRES_LOG_MIN_MESSAGES:-warning}
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
      - ./logs:/var/log/actian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      metabase-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/var/log/actian
    # Metabase logs to stdout; tee it into the shared dir so the web UI can read
    # it (Metabase's own log framework is not easily redirected to a file).
    entrypoint: ["/bin/bash", "-c"]
    command: ["/app/run_metabase.sh 2>&1 | tee -a /var/log/actian/metabase.log"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
      MB_DB_HOST: metabase-db

  # One-shot job: provisions the Metabase dashboard automatically on first start.
  # Reuses the collector image (it already has httpx + python-dotenv); the setup
  # script is idempotent and polls Metabase health, so it self-waits and is safe
  # to re-run on every `up`. Exits 0 when done.
  metabase-setup:
    build:
      context: ./collector
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      metabase:
        condition: service_started
    volumes:
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/setup_metabase.py"]
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@actian-companion.local}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-Actian-Companion-2026}
      METABASE_SITE_NAME: ${METABASE_SITE_NAME:-Actian Data Intelligence Companion}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-actian_companion}
      POSTGRES_USER: ${POSTGRES_USER:-actian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

volumes:
  db_data:
  metabase_db_data:
