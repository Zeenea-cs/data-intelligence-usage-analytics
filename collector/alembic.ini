# Alembic configuration for the collector.
#
# The collector runs migrations programmatically at startup (app.migrate), which
# sets script_location and sqlalchemy.url on the Config object. This file lets
# the `alembic` CLI work too (e.g. `alembic revision`, `alembic upgrade head`)
# when run from the collector/ directory.

[alembic]
script_location = migrations

# Put the collector root on sys.path so env.py can `import app...`.
prepend_sys_path = .

# The database URL is normally injected by app.migrate. For ad-hoc CLI use,
# override with: alembic -x ... or set DATABASE_URL and read it in env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
